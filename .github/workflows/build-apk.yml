name: Build Bruno Run Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Bruno-Run.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bruno-Run-APK
          path: release-output/Bruno-Run.apk

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "Bruno Run v1.2.0 - Adicionada FASE CHEFÃO no Espaço Profundo com Meteoritos!"
          body: |
            ## ☄️ Bruno Run v1.2.0 - Nova FASE CHEFÃO!

            👉 **[Download Direto do Bruno-Run.apk (v1.2.0)](https://github.com/${{ github.repository }}/releases/download/v1.2.0/Bruno-Run.apk)**

            <p align="center">
              <img src="https://raw.githubusercontent.com/${{ github.repository }}/main/qrcode-download.png" width="220" alt="QR Code Bruno Run" />
            </p>

            ---

            ### 🚀 As 4 Fases do Jogo:
            1. 🏎️ **Fase 1: Podracer de Anakin no Planeta Cânion** (0 a 999 pts) — Pirâmides de cristal estáticas com 3 sóis na manhã.
            2. 🛡️ **Fase 2: Razor Crest do Mandaloriano** (1.000 a 2.499 pts) — Planeta ao crepúsculo. A velocidade reinicia para adaptação!
            3. 🚀 **Fase 3: N-1 Starfighter com Grogu** (2.500 a 4.499 pts) — Planeta noturno sob as estrelas. Velocidade reiniciada!
            4. ☄️ **Fase 4: FASE CHEFÃO - ESPAÇO PROFUNDO & METEORITOS** (4.500+ pts):
               - A nave decola e rompe a atmosfera do planeta!
               - O solo desaparece e você pilota no vácuo do **Espaço Profundo** com estrelas cósmicas à distância.
               - Os obstáculos tornam-se **METEORITOS e ASTEROIDES 3D gigantes** flutuantes!
               - A velocidade reinicia no início da fase chefão para dar fôlego ao jogador, aumentando gradativamente rumo à pontuação máxima!
               - Botão de atalho rápido na tela inicial para testar a **Fase Chefão** direto!
          files: release-output/Bruno-Run.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
