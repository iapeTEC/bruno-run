name: Build Bruno Run Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Bruno-Run.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bruno-Run-APK
          path: release-output/Bruno-Run.apk

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "Bruno Run v1.1.0 - Superfície Planetária, 3 Sóis & Dificuldade Equilibrada"
          body: |
            ## 🚀 Bruno Run v1.1.0 - Grande Atualização!

            👉 **[Download Direto do Bruno-Run.apk (v1.1.0)](https://github.com/${{ github.repository }}/releases/download/v1.1.0/Bruno-Run.apk)**

            <p align="center">
              <img src="https://raw.githubusercontent.com/${{ github.repository }}/main/qrcode-download.png" width="220" alt="QR Code Bruno Run" />
            </p>

            ---

            ### 🪐 Novidades desta Versão:
            - **Superfície Planetária**: O jogo agora se passa na superfície de um cânion desértico alienígena com solo e sombra dinâmica da nave.
            - **Transição Dia / Noite com 3 Sóis**: Três sóis (um central grandioso e dois pequenos companheiros orbitando) cruzam o céu em um ciclo fade suave (Manhã ➡️ Dia Pleno ➡️ Pôr do Sol ➡️ Noite com estrelas ➡️ Madrugada).
            - **Obstáculos Estáticos & Menor Densidade**: As pirâmides e cristais agora ficam fixos no solo, sem girar nem flutuar descontroladamente, facilitando desviar com precisão.
            - **Dificuldade Gradativa & Reset de Velocidade**: O jogo começa calmo e acelera progressivamente. Ao desbloquear uma nova nave, a velocidade reduz de volta ao cruzeiro inicial para você se adaptar e acelerar novamente!
            - **Planícies Seguras**: Setores limpos sem obstáculos para usar o Turbo de Plasma com segurança total.
          files: release-output/Bruno-Run.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
