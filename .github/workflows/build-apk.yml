name: Build Bruno Run Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Bruno-Run.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bruno-Run-APK
          path: release-output/Bruno-Run.apk

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "Bruno Run v1.3.0 - Banco de Dados Google Sheets & Manobras 3D nos Asteroides"
          body: |
            ## 📊 Bruno Run v1.3.0 - Atualização com Banco de Dados e Manobras 3D!

            👉 **[Download Direto do Bruno-Run.apk (v1.3.0)](https://github.com/${{ github.repository }}/releases/download/v1.3.0/Bruno-Run.apk)**

            <p align="center">
              <img src="https://raw.githubusercontent.com/${{ github.repository }}/main/qrcode-download.png" width="220" alt="QR Code Bruno Run" />
            </p>

            ---

            ### 🆕 O que há de novo na v1.3.0:
            1. 👤 **Identificação de Piloto**: Digite seu nome na tela inicial (salvo automaticamente).
            2. 📊 **Banco de Dados Google Sheets via Apps Script**:
               - Cada partida encerrada registra automaticamente data/hora, nome do piloto, pontuação, fase atingida e distância percorrida na planilha oficial do Google Sheets!
               - Botão de Ranking Global no jogo e link direto para abrir a planilha.
            3. ☄️ **Manobras 3D no Campo de Asteroides (Fase Chefão)**:
               - Asteroides e meteoritos agora ficam amplamente espalhados em 3D: alguns gigantes no alto (para passar **POR BAIXO**), outros gigantes embaixo (para passar **POR CIMA**) e nas laterais (para passar **PELOS LADOS**)!
               - Desafio supremo de navegação no vácuo cósmico.
          files: release-output/Bruno-Run.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
