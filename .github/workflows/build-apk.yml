name: Build Bruno Run Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Bruno-Run.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bruno-Run-APK
          path: release-output/Bruno-Run.apk

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.1
          name: "Bruno Run v1.3.1 - Notificações Compactas na Lateral Esquerda"
          body: |
            ## 🚀 Bruno Run v1.3.1 - Notificações Compactas & Visão 100% Livre!

            👉 **[Download Direto do Bruno-Run.apk (v1.3.1)](https://github.com/${{ github.repository }}/releases/download/v1.3.1/Bruno-Run.apk)**

            <p align="center">
              <img src="https://raw.githubusercontent.com/${{ github.repository }}/main/qrcode-download.png" width="220" alt="QR Code Bruno Run" />
            </p>

            ---

            ### 🎯 Melhorias da v1.3.1:
            - **Notificações Compactas na Lateral Esquerda**: Alertas de "Setor Seguro / Planície Livre" e "Nova Nave / Fase Chefão" agora surgem discretamente no canto esquerdo da tela em tamanho compacto com barra de destaque neon, deixando o centro da tela 100% livre para visualização dos obstáculos e meteoritos!
            - **Banco de Dados Google Sheets & Ranking Global Ativo**.
            - **Manobras 3D Livres no Campo de Meteoritos da Fase Chefão**.
          files: release-output/Bruno-Run.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
