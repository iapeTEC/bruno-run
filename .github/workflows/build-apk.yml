name: Build Bruno Run Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Bruno-Run.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bruno-Run-APK
          path: release-output/Bruno-Run.apk

      - name: Create GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.0
          name: "Bruno Run v1.4.0 - PIN de 4 Dígitos, Proteção de Recorde & GitHub Pages"
          body: |
            ## 🚀 Bruno Run v1.4.0 - PIN de Segurança, Recordes Únicos & Versão Online!

            👉 **[Download Direto do Bruno-Run.apk (v1.4.0)](https://github.com/${{ github.repository }}/releases/download/v1.4.0/Bruno-Run.apk)**

            🌐 **[Jogar Online no Navegador (GitHub Pages)](https://iapetec.github.io/bruno-run/)**

            <p align="center">
              <img src="https://raw.githubusercontent.com/${{ github.repository }}/main/qrcode-download.png" width="220" alt="QR Code Bruno Run" />
            </p>

            ---

            ### 🎯 Novidades da v1.4.0:
            - **Sistema de Login com PIN de 4 Dígitos**: Crie seu piloto e defina um PIN de 4 dígitos. Apenas você com seu PIN pode atualizar sua pontuação!
            - **Anti-Duplicação de Jogadores no Ranking**: A planilha Google Sheets agora mantém apenas um registro por piloto com o **maior recorde pessoal**.
            - **Versão Web Online no GitHub Pages**: Jogue direto pelo navegador no PC com suporte a teclas WASD / Setas para voo 3D e Barra de Espaço para liberar o Turbo Plasma.
            - **Notificações Compactas na Lateral Esquerda**: Alertas discretos para manter a visão de voo 100% desobstruída.
          files: release-output/Bruno-Run.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
